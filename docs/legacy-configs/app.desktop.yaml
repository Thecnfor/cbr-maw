# 桌面安装包专用配置（desktop profile）。
#
# 仅被打进 Windows 桌面安装包，并由 cbr-server 冻结产物默认加载
# （见 packaging/pyinstaller/launcher.py：冻结态且资源根存在本文件时
# 自动设置 CBR_CONFIG=configs/app.desktop.yaml）。源码运行与离线测试仍用
# configs/app.yaml，因此本文件不影响 pytest 的默认行为。
#
# 与 configs/app.yaml 的差异只有两项：
#   - ingest.enabled: true      随 API 启动后台定时抓取
#   - ingest.run_on_start: true 启动即抓一次，让「实时情报流」开箱有内容
# interval_seconds（3600）与 llm.allow_mock（false）均与基线一致。

app_name: CBR-MAW
timezone: Asia/Shanghai

llm:
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.0
  max_tokens: 2000
  # 产品运行时禁用一切 mock：缺 key 仅展示只读观测面并引导配置 DeepSeek API key，
  # 绝不允许 MockLLM / 规则模板降级冒充模型分析。
  mock: false
  allow_mock: false
  api_key_env: DEEPSEEK_API_KEY
  api_key_file: secrets/deepseek.key
  timeout_seconds: 60
  max_retries: 2

data:
  dataset: auto          # auto | custom | public | synthetic
  custom_data_dir: data/custom
  pit_db: data/pit.duckdb
  sample_dir: data/samples
  snapshot_dir: data/processed
  sample_start: "2018-01-01"
  sample_end: "2025-09-30"
  label_version: stress_pca_q90
  high_stress_quantile: 0.90
  horizons: [5, 10, 20]

# 实时智能抓取（L1.5 数据接入层）：来源见 configs/sources.yaml
ingest:
  enabled: true           # true 时随 API 启动后台定时抓取（桌面版默认开启）
  run_on_start: true      # 启动时立即抓一次（桌面版首屏即有实时序列）
  interval_seconds: 3600  # 后台抓取间隔（秒）
  sources_config: configs/sources.yaml
  stale_threshold_days: 3        # 日频序列超过该天数未更新即视为陈旧
  monthly_stale_threshold_days: 40
  write_to_pit: true
  refresh_provider_after_run: true   # 抓取写回后热刷新 DataProvider
  http_timeout_seconds: 20
  http_retries: 2
  log_dir: artifacts/ingest
  inbox_dir: data/inbox
  inbox_enabled: true

signal:
  model_version: fusion-xgb-v1
  baseline: xgboost
  text_enabled: true
  roll_window: 500
  retrain_every: 20

orchestration:
  rounds: 2
  max_tool_calls_per_agent: 6
  max_tokens_per_agent: 4000
  numeric_tolerance_abs: 1.0e-6
  numeric_tolerance_rel: 1.0e-3
  modes: [single, independent, collaborative]
  human_in_the_loop: true
  trace_dir: artifacts/traces
  # 协同成本折算（统一成本单位；J = L + μ·C）
  cost_per_tool_call: 0.001
  cost_per_1k_tokens: 0.001
  cost_per_latency_ms: 0.00001
  coordination_weight_mu: 0.1

server:
  api_host: 127.0.0.1
  api_port: 8000
  ui_port: 8501

paths:
  artifacts: artifacts
  docs: docs
  knowledge: data/knowledge
