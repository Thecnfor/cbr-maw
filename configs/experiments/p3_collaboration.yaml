# 示例实验配置：P3 多智能体协同对照（single / independent / collaborative）
# 使用：python scripts/run_experiment.py --kind p3 --config configs/experiments/p3_collaboration.yaml
run_id: p3_collaboration_v1
data:
  sample_start: "2018-01-01"
  sample_end: "2025-09-30"
  pit_snapshot: auto
target:
  label_version: stress_pca_q90
  horizons: [5, 10, 20]
  eval_start: "2021-01-01"
modality:
  numeric: true
  text: true
augment:
  rag: true
  tools: true
agents:
  enabled: true
  modes: [single, independent, collaborative]
coordination:
  evidence_share: true
  cross_validation: true
  conflict_resolution: true
budget:
  equal_across_configs: true      # 三模式同每角色预算：6 tool calls / 4000 tokens
  max_tool_calls_per_agent: 6
  max_tokens_per_agent: 4000
llm:
  provider: deepseek
  mock_when_no_key: true
eval:
  bootstrap: 200
  metrics: [task_completion, decision_loss, coordination_cost, conflicts_total, conflicts_resolved, verification_passed, numeric_error_rate]
