# CBR-MAW 实时智能抓取来源（L1.5 数据接入层）
#
# 由 src/cbr/ingest 消费：计划器按覆盖期/陈旧度决定抓谁，抓取器按 kind 执行。
# 支持的 kind：http_csv | http_json | akshare | rss（见 src/cbr/ingest/sources.py）。
#
# 时点（PIT）约定（与 docs/data/real_data_integration.md §3 一致）：
#   release_lag_days + publish_hour/publish_minute + tz_offset 共同决定 release_time。
#   - A 股/中债/港股：观测日当日 18:00 (+08:00)
#   - 隔夜海外因子（VIX/SP500/US10Y）：观测日次日 09:00 (+08:00)   ← release_lag_days: 1
#   - 月频：按发布日在 settings.ingest.monthly_stale_threshold_days 内不算陈旧
#
# 说明：这里只声明「公开、免 key」的接口；未声明的序列（如北向资金、部分月频宏观）
# 没有可用公开来源，会在 /api/ingest/status 中标注 fetchable=false。

sources:
  # ------------------------------------------------------------------ #
  # A 股指数 / AH 溢价（东方财富 push2his 日 K）
  # ------------------------------------------------------------------ #
  - id: em_csi300
    kind: http_json
    enabled: true
    series: [market.cn_equity.csi300]
    interval_seconds: 1800
    params:
      url: "https://push2his.eastmoney.com/api/qt/stock/kline/get"
      query:
        secid: "1.000300"
        klt: "101"
        fqt: "0"
        lmt: "10000"
        end: "20500000"
        fields1: "f1,f2,f3,f4,f5,f6,f7,f8"
        fields2: "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64"
      rows_path: "data.klines"
      row_split: ","
      date_field: 0
      value_field: 2          # 0=日期,1=开,2=收,3=高,4=低...
      unit: "点"
      source: eastmoney
      headers: { Referer: "https://quote.eastmoney.com/" }
      release_lag_days: 0
      publish_hour: 18
      tz_offset: "+08:00"

  - id: em_csi500
    kind: http_json
    enabled: true
    series: [market.cn_equity.csi500]
    interval_seconds: 1800
    params:
      url: "https://push2his.eastmoney.com/api/qt/stock/kline/get"
      query:
        secid: "1.000905"
        klt: "101"
        fqt: "0"
        lmt: "10000"
        end: "20500000"
        fields1: "f1,f2,f3,f4,f5,f6,f7,f8"
        fields2: "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64"
      rows_path: "data.klines"
      row_split: ","
      date_field: 0
      value_field: 2
      unit: "点"
      source: eastmoney
      headers: { Referer: "https://quote.eastmoney.com/" }
      release_lag_days: 0
      publish_hour: 18
      tz_offset: "+08:00"

  - id: em_ah_premium
    kind: http_json
    enabled: true
    series: [crossborder.flows.ah_premium]
    interval_seconds: 1800
    params:
      url: "https://push2his.eastmoney.com/api/qt/stock/kline/get"
      query:
        secid: "100.HSAHP"
        klt: "101"
        fqt: "0"
        lmt: "10000"
        end: "20500000"
        fields1: "f1,f2,f3,f4,f5,f6,f7,f8"
        fields2: "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64"
      rows_path: "data.klines"
      row_split: ","
      date_field: 0
      value_field: 2
      unit: "点"
      source: eastmoney
      headers: { Referer: "https://quote.eastmoney.com/" }
      release_lag_days: 0
      publish_hour: 18
      tz_offset: "+08:00"

  # ------------------------------------------------------------------ #
  # 隔夜海外：标普 500（东财）/ VIX（CBOE 官方 CSV）
  # ------------------------------------------------------------------ #
  - id: em_sp500
    kind: http_json
    enabled: true
    series: [market.global.sp500]
    interval_seconds: 3600
    params:
      url: "https://push2his.eastmoney.com/api/qt/stock/kline/get"
      query:
        secid: "100.SPX"
        klt: "101"
        fqt: "0"
        lmt: "10000"
        end: "20500000"
        fields1: "f1,f2,f3,f4,f5,f6,f7,f8"
        fields2: "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64"
      rows_path: "data.klines"
      row_split: ","
      date_field: 0
      value_field: 2
      unit: "点"
      source: eastmoney
      headers: { Referer: "https://quote.eastmoney.com/" }
      release_lag_days: 1        # 美股 16:00 ET 收盘 → 北京时间次日可得
      publish_hour: 9
      tz_offset: "+08:00"

  - id: cboe_vix
    kind: http_csv
    enabled: true
    series: [market.global.vix]
    interval_seconds: 3600
    params:
      url: "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv"
      date_column: DATE
      value_column: CLOSE
      date_format: "%m/%d/%Y"
      unit: "点"
      source: cboe
      release_lag_days: 1
      publish_hour: 9
      tz_offset: "+08:00"

  # ------------------------------------------------------------------ #
  # 可选：akshare 公开接口（未安装 akshare 时状态为 skipped，不影响其它来源）
  #   pip install akshare 后自动启用；列名为 akshare 当前版本口径。
  # ------------------------------------------------------------------ #
  - id: akshare_cgb_2y
    kind: akshare
    enabled: true
    series: [market.cn_bond.cgb_2y]
    interval_seconds: 3600
    params:
      func: bond_zh_us_rate
      kwargs: { start_date: "2015-01-01" }
      date_column: "日期"
      value_column: "中国国债收益率2年"
      unit: "%"
      source: akshare/bond_zh_us_rate
      release_lag_days: 0
      publish_hour: 18
      tz_offset: "+08:00"

  - id: akshare_cgb_10y
    kind: akshare
    enabled: true
    series: [market.cn_bond.cgb_10y]
    interval_seconds: 3600
    params:
      func: bond_zh_us_rate
      kwargs: { start_date: "2015-01-01" }
      date_column: "日期"
      value_column: "中国国债收益率10年"
      unit: "%"
      source: akshare/bond_zh_us_rate
      release_lag_days: 0
      publish_hour: 18
      tz_offset: "+08:00"

  - id: akshare_us10y
    kind: akshare
    enabled: true
    series: [market.global.us10y]
    interval_seconds: 3600
    params:
      func: bond_zh_us_rate
      kwargs: { start_date: "2015-01-01" }
      date_column: "日期"
      value_column: "美国国债收益率10年"
      unit: "%"
      source: akshare/bond_zh_us_rate
      release_lag_days: 1
      publish_hour: 9
      tz_offset: "+08:00"

  # ------------------------------------------------------------------ #
  # 文本语料：央行/监管与市场新闻 RSS（产出 documents 表行）
  # ------------------------------------------------------------------ #
  - id: rss_fed_press
    kind: rss
    enabled: true
    documents: true
    interval_seconds: 3600
    params:
      url: "https://www.federalreserve.gov/feeds/press_all.xml"
      encoding: utf-8
      source: federal_reserve
      limit: 100

  - id: rss_wsj_markets
    kind: rss
    enabled: true
    documents: true
    interval_seconds: 3600
    params:
      url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"
      encoding: utf-8
      source: wsj_markets
      limit: 100

  # ------------------------------------------------------------------ #
  # 备源：腾讯日 K（当东财限流/不可用时自动接替；同一序列可声明多个来源）
  # ------------------------------------------------------------------ #
  - id: tencent_csi300
    kind: http_json
    enabled: true
    series: [market.cn_equity.csi300]
    interval_seconds: 1800
    params:
      url: "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get"
      query: { param: "sh000300,day,,,640,qfq" }
      rows_path: "data.sh000300.day"
      row_split: ","
      date_field: 0
      value_field: 2
      unit: "点"
      source: tencent
      headers: { Referer: "https://gu.qq.com/" }
      release_lag_days: 0
      publish_hour: 18
      tz_offset: "+08:00"

  - id: tencent_csi500
    kind: http_json
    enabled: true
    series: [market.cn_equity.csi500]
    interval_seconds: 1800
    params:
      url: "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get"
      query: { param: "sh000905,day,,,640,qfq" }
      rows_path: "data.sh000905.day"
      row_split: ","
      date_field: 0
      value_field: 2
      unit: "点"
      source: tencent
      headers: { Referer: "https://gu.qq.com/" }
      release_lag_days: 0
      publish_hour: 18
      tz_offset: "+08:00"

  - id: tencent_sp500
    kind: http_json
    enabled: true
    series: [market.global.sp500]
    interval_seconds: 3600
    params:
      url: "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get"
      query: { param: "usINX,day,,,640,qfq" }
      rows_path: "data.usINX.day"
      row_split: ","
      date_field: 0
      value_field: 2
      unit: "点"
      source: tencent
      headers: { Referer: "https://gu.qq.com/" }
      release_lag_days: 1
      publish_hour: 9
      tz_offset: "+08:00"
