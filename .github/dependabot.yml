# =============================================================================
# CBR-MAW · Dependabot 依赖更新
#
# - pip：根目录 requirements.txt / requirements-dev.txt / pyproject.toml
# - bun：web/bun.lock（文本格式；需 bun >= 1.1.39，本仓库锁定 1.3.13）
# - github-actions：.github/workflows/ 中的 action 版本
#
# 策略：minor/patch 合并为一个 PR（减少噪音），major 单独 PR 由人工评估。
# 依赖更新 PR 仍需通过 CI（lint + pytest + web build）与 CODEOWNERS 评审。
# =============================================================================
version: 2

updates:
  # ---- Python 依赖 -----------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- 前端依赖（bun）--------------------------------------------------------
  - package-ecosystem: bun
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: ["dependencies", "web"]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---- GitHub Actions --------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
