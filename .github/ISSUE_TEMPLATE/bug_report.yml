name: Bug 报告
description: 报告可复现的缺陷（运行报错、结果不一致、UI 异常等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认：已按 README「快速开始」完成数据构建；未配置 `DEEPSEEK_API_KEY`
        时系统使用 Mock LLM，属正常行为而非缺陷。**请勿粘贴真实 API Key、原始数据或 `.env` 内容。**

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
      placeholder: 期望 …；实际 …；错误信息/堆栈（请脱敏）…
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量给出可复制执行的命令与参数
      placeholder: |
        1. .venv\Scripts\python.exe scripts\build_sample_data.py
        2. .venv\Scripts\python.exe -m uvicorn cbr.api.main:app --port 8000
        3. 请求 /api/decision?as_of=2024-08-05
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: 期望结果
      placeholder: 期望返回 200 / 期望 3 张风险卡 …
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Python、依赖安装方式、前端 bun/node 版本、数据来源（samples/custom）
      placeholder: Windows 11 / Python 3.12.14 / pip install -r requirements.txt / bun 1.3.13 / node v25.6.1 / data/samples（synthetic）
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 影响模块
      options:
        - 数据层 / PIT（src/cbr/data）
        - 特征 / 信号模型（src/cbr/features, models）
        - 工具 / 知识库（src/cbr/tools, knowledge）
        - 智能体 / 协同 / 核验（src/cbr/agents, orchestration, verification）
        - FastAPI / SSE（src/cbr/api）
        - React 驾驶台（web/）
        - Streamlit 回退 UI（app/）
        - 脚本 / 实验（scripts/）
        - 文档
        - 不确定
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / trace 片段
      description: 请脱敏（去掉 key、绝对用户路径、原始数据内容）。可用 artifacts/runs 下的 trace。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索既有 issue，未发现重复问题
          required: true
        - label: 我未在内容中包含密钥、`.env` 或原始数据
          required: true
