<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CBR-MAW 跨境金融风险多智能体协同预警系统 · 风险驾驶台与智能对话"
    />
    <title>CBR-MAW · 跨境风险协同预警驾驶台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%23fff' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23fff'/%3E%3C/svg%3E"
    />
    <!-- 首屏主题预置：URL ?theme=light|dark 优先（便于验收/截图），否则读取 localStorage -->
    <script>
      (function () {
        try {
          var forced = new URLSearchParams(window.location.search).get("theme");
          var stored = window.localStorage.getItem("cbr-theme");
          var dark = forced === "dark" || (forced !== "light" && stored === "dark");
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.background = "#101010";
          } else {
            document.documentElement.style.background = "#fafafa";
          }
        } catch (error) {
          document.documentElement.style.background = "#fafafa";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
