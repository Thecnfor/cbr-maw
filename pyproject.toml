[build-system]
# setuptools>=77 才支持 PEP 639 的 license / license-files 写法
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cbr-maw"
version = "1.0.0"
description = "CBR-MAW：跨境金融风险多智能体协同预警系统（确定性金融工具 + LLM 智能体编排 + 证据链核验 + 配置化消融实验）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thecnfor" }]
keywords = [
    "multi-agent",
    "cross-border",
    "financial-risk",
    "early-warning",
    "point-in-time",
    "evidence-chain",
    "llm",
    "deepseek",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 运行时依赖刻意留在 requirements.txt（README 安装流程：先装 requirements.txt，
# 再 `pip install -e . --no-deps`）。此处保持为空，保证 editable 安装轻量、可离线。
dependencies = []

[project.optional-dependencies]
# 开发/CI：`pip install -e ".[dev]"` 或 `pip install -r requirements-dev.txt`
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/Thecnfor/cbr-maw"
Repository = "https://github.com/Thecnfor/cbr-maw"
Issues = "https://github.com/Thecnfor/cbr-maw/issues"
Documentation = "https://github.com/Thecnfor/cbr-maw/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cbr*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
# 真实 DeepSeek 用例在无 DEEPSEEK_API_KEY 时自动 skip（见 tests/test_agents.py）

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
    ".venv",
    ".venv-probe",
    ".references",
    "web",
    "data",
    "artifacts",
    "docs",
    "build",
    "dist",
]

[tool.ruff.lint]
# 门禁规则集：只开启“真正的错误”（语法错误 / 未定义名称 / 比较/格式串错误），
# 保证历史代码零噪声、CI 绿。代码风格债（未使用导入、import 排序、pyupgrade 等）
# 由 CI 的“提示性 ruff”步骤输出，不阻断合并；后续可按目录分批加严：
#   --select E4,E7,E9,F,I,B  ->  --select E4,E7,E9,F,I,B,UP,SIM
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# 既有的“仅为导出/注册而保留导入”的模块；加严规则时按需放开
"src/cbr/__init__.py" = ["F401"]
"tests/**" = ["F401"]
"scripts/**" = ["F401"]

[tool.ruff.format]
# 暂不强制格式化（避免一次提交产生大量纯格式 diff）；仅约定行宽与引号风格
quote-style = "double"
line-ending = "lf"
